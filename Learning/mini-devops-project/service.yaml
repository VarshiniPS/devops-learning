apiVersion: v1
kind: Service
metadata:
  name: my-app-service
  namespace: default
  labels:
    app: my-app
spec:
  type: ClusterIP          # Default type — internal cluster access only
  selector:
    app: my-app            # Matches Pods with this label
  ports:
    - name: http
      protocol: TCP
      port: 80             # Port the Service exposes internally
      targetPort: 8080     # Port the Pod/container is actually listening on
