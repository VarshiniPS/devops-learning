apiVersion: apps/v1
kind: Deployment

metadata:
  name: nodejs-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nodejs-app

  template:
    metadata:
      labels:
        app: nodejs-app

    spec:
      containers:
      - name: nodejs-container
        image: varshinips/node-app:v1
        imagePullPolicy: Never

        ports:
        - containerPort: 3000