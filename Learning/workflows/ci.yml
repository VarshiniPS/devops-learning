```yaml
name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display Message
        run: echo "GitHub Actions Pipeline Running"

      - name: Show Current Directory
        run: pwd

      - name: List Files
        run: ls -la
```
