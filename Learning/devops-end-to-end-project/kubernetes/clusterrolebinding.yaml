# -----------------------------------------------------------------------------
# CLUSTERROLEBINDING
#
# Grants the ClusterRole cluster-wide — this ServiceAccount can now read
# node info regardless of namespace, because nodes aren't namespaced to
# begin with.
# -----------------------------------------------------------------------------

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-reader-binding
subjects:
  - kind: ServiceAccount
    name: pod-reader-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: node-reader-clusterrole
  apiGroup: rbac.authorization.k8s.io
