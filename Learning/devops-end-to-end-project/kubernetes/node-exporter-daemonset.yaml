# -----------------------------------------------------------------------------
# DAEMONSET
#
# Ensures exactly one node-exporter pod runs on every node in the cluster.
# Unlike a Deployment, there's no `replicas:` field — the number of pods is
# tied directly to the number of nodes. Add a node, a pod appears there
# automatically; remove a node, its pod is cleaned up automatically.
#
# hostNetwork/hostPID are used here because node-exporter needs to read the
# HOST's metrics (CPU, memory, disk) directly, not just its own container's.
# -----------------------------------------------------------------------------

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:latest
          ports:
            - containerPort: 9100
              hostPort: 9100
              name: metrics
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
