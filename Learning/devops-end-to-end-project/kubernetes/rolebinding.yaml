# -----------------------------------------------------------------------------
# ROLEBINDING
#
# Connects the "who" (ServiceAccount) to the "what" (Role), within the same
# namespace. After this applies, pod-reader-sa can get/list/watch pods in
# the default namespace — nothing more, nothing less, nowhere else.
# -----------------------------------------------------------------------------

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: pod-reader-sa
    namespace: default
roleRef:
  kind: Role
  name: pod-reader-role
  apiGroup: rbac.authorization.k8s.io
