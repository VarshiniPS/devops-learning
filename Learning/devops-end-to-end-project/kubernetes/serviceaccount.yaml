# -----------------------------------------------------------------------------
# SERVICE ACCOUNT
#
# A ServiceAccount is an identity that pods use to authenticate to the Kubernetes API — distinct from a human user account. 
# Kubernetes automatically mounts a token for the ServiceAccount into the pod, which the application uses to make authenticated API calls. 
# Every pod has one — if you don't specify one, it's automatically assigned the namespace's default ServiceAccount. 
# ServiceAccounts are namespace-scoped, and they're commonly used for things like CI/CD pipelines or monitoring agents that need to talk to the API without using a human's credentials.
# 
# 
# -----------------------------------------------------------------------------

apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader-sa
  namespace: default
