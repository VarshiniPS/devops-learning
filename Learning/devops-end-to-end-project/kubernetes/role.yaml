# -----------------------------------------------------------------------------
# ROLE
#
# Defines WHAT is allowed — here, read-only access to pods — scoped to a
# single namespace (default). This does nothing on its own until bound to
# an identity via a RoleBinding.
# -----------------------------------------------------------------------------

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader-role
  namespace: default
rules:
  - apiGroups: [""]              # "" means the core API group (pods, services, etc.)
    resources: ["pods"]
    verbs: ["get", "list", "watch"]   # read-only — no create/update/delete
