# -----------------------------------------------------------------------------
# ALLOW FRONTEND -> BACKEND ONLY
#
# This targets pods labeled app=backend (podSelector). Combined with the
# default-deny-all policy above, backend now accepts INBOUND traffic only
# from pods labeled app=frontend, on port 80 -- everything else inbound is
# blocked, including other pods in the same namespace that aren't frontend.
# -----------------------------------------------------------------------------

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 80
