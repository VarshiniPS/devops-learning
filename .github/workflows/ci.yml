name: CI

# ── TRIGGER ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:          # allows manual run from the GitHub Actions tab

# Project lives nested inside the repo, not at the root.
# Every path below is relative to the repo root: devops-learning/
env:
  PROJECT_DIR: Learning/devops-end-to-end-project

jobs:

  # ── JOB 1: Test ──────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      # Checkout — clones the repo onto the fresh runner VM
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js matching the Dockerfile's node:22-alpine
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # Install — npm ci is reproducible, fails if lock file is out of sync
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}/app
        run: npm ci

      # Run the Jest suite (5 tests covering /, /health, /ready, /info, 404)
      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}/app
        run: npm test

      # Upload coverage report as a build artifact
      - name: Upload coverage report
        if: always()             # upload even if tests failed, for debugging
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.PROJECT_DIR }}/app/coverage/
          retention-days: 7

  # ── JOB 2: Build Docker image ───────────────────────────────────────────────
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test]               # only build if tests passed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx — enables layer caching and multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image using the project's Dockerfile, tag with commit SHA + latest
      # context is the PROJECT_DIR, not the repo root, since app/ lives there
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.PROJECT_DIR }}
          file: ${{ env.PROJECT_DIR }}/docker/Dockerfile
          push: false
          tags: |
            node-app:${{ github.sha }}
            node-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sanity check — run the built image and hit /health before calling it done
      - name: Smoke test the built image
        run: |
          docker run -d --name smoke-test -p 3000:3000 node-app:latest
          sleep 5
          curl --fail http://localhost:3000/health
          docker rm -f smoke-test