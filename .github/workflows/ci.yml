name: CI

# ── TRIGGER ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:          # allows manual run from the GitHub Actions tab

# Project lives nested inside the repo, not at the root.
# Every path below is relative to the repo root: devops-learning/
env:
  PROJECT_DIR: Learning/devops-end-to-end-project

jobs:

  # ── JOB 1: Test ──────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      # Checkout — clones the repo onto the fresh runner VM
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js matching the Dockerfile's node:22-alpine
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # Install — npm ci is reproducible, fails if lock file is out of sync
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}/app
        run: npm ci

      # Run the Jest suite (5 tests covering /, /health, /ready, /info, 404)
      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}/app
        run: npm test

      # Upload coverage report as a build artifact
      - name: Upload coverage report
        if: always()             # upload even if tests failed, for debugging
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.PROJECT_DIR }}/app/coverage/
          retention-days: 7

  # ── JOB 2: Build Docker image ───────────────────────────────────────────────
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test]               # only build if tests passed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx — enables layer caching and multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image using the project's Dockerfile, tag with commit SHA + latest
      # context is the PROJECT_DIR, not the repo root, since app/ lives there
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.PROJECT_DIR }}
          file: ${{ env.PROJECT_DIR }}/Dockerfile
          push: false
          load: true            # loads the built image into the local daemon
                                 # required for the smoke test below to find it
          tags: |
            node-app:${{ github.sha }}
            node-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sanity check — run the built image and hit /health before calling it done
      - name: Smoke test the built image
        run: |
          docker run -d --name smoke-test -p 3000:3000 node-app:latest
          sleep 5
          curl --fail http://localhost:3000/health
          docker rm -f smoke-test

  # ── JOB 3: Push to Amazon ECR ────────────────────────────────────────────────
  push:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: [build]               # only push if build + smoke test passed
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    outputs:
      registry: ${{ steps.ecr-login.outputs.registry }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Assumes an IAM role trusted for GitHub OIDC — no long-lived AWS keys stored as secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Rebuild (cache from previous job means this is fast) and push both tags
      - name: Build and push to ECR
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.PROJECT_DIR }}
          file: ${{ env.PROJECT_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/node-app:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/node-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── JOB 4: Deploy to EKS ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [push]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Point kubectl at the EKS cluster's control plane
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name my-cluster --region us-east-1

      # Roll the Deployment to the freshly pushed commit-SHA-tagged image
      # kubectl set image triggers a standard RollingUpdate — see docs/rolling-updates.md
      - name: Deploy new image
        run: |
          kubectl set image deployment/nodejs-deployment \
            node-app=${{ needs.push.outputs.registry }}/node-app:${{ github.sha }} \
            -n default

      # Block until the rollout finishes or fails — surfaces a stuck rollout as a CI failure
      - name: Wait for rollout to complete
        run: kubectl rollout status deployment/nodejs-deployment -n default --timeout=300s
